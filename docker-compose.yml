name: device-lending

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-app-password}
      - DB_NAME=app
      - MASTER_DB=master
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
    # 初回だけデモ用の架空データを入れてから起動する（機器が 1 台でもあれば何もしない）
    command: ["sh", "-c", "python seed_demo.py && python app.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4.7
    command: ["--default-time-zone=+09:00"]
    ports:
      - "127.0.0.1:3316:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password}
      MYSQL_DATABASE: app
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app-password}
      TZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-password}"]
      interval: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
